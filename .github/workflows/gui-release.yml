name: Release GUI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "作成するタグ（例: v1.0.0）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: gui-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "タグは v1.0.0 の形にしてください: ${TAG}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "タグ ${TAG} は既にあります。ビルドと Release の更新だけ行います。"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "${TAG}" -m "scrcpy GUI ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        shell: pwsh
        run: packaging/build_windows_exe.ps1

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          asset="dist/scrcpy-gui-${tag}-windows-x64.exe"
          cp dist/scrcpy-gui.exe "${asset}"
          cat > release-notes.md << EOF
          Windows 用の scrcpy GUI（${tag}）です。

          - \`scrcpy-gui-${tag}-windows-x64.exe\` を実行します。Python は不要です。
          - ミラー本体の scrcpy.exe は同梱していません。PATH、WinGet、Scoop、Chocolatey のいずれか、または画面の「参照」で指定します。
          - タグは Actions の Release GUI から作成しています。
          EOF
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
          else
            gh release create "${tag}" "${asset}" \
              --title "scrcpy GUI ${tag}" \
              --notes-file release-notes.md
          fi
